[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Regenerates the HARTI weekly Passion Fruit + Moringa analysis every Monday
# at 02:30 UTC (08:00 Sri Lanka time) - matches the "Next scheduled analysis:
# Monday 08:00 AM" text shown on the HARTI Market Intelligence page.
# See netlify/functions/harti-weekly-cron.ts.
[functions."harti-weekly-cron"]
  schedule = "30 2 * * 1"

# NO Netlify scheduled function for the daily business pulse — removed
# 2026-08-20 (was netlify/functions/plantation-pulse.ts / PR #3). Verified
# on a sibling SFC app (same Netlify team) that scheduled functions here arm
# but do not reliably invoke, and are not externally triggerable (403 on
# both direct HTTP and the dashboard "Run now"), so a broken pulse would be
# silent and unverifiable. The pulse is now app/api/automation/pulse/route.ts,
# a plain Next.js API route driven by pg_cron net.http_post on SPINE's
# SRV-Workspace Supabase project (yrztitqsjzdhamomrurl) — this app's own
# Supabase project is on a different account with no MCP/CLI access from the
# SPINE tooling side, so the cron job lives in SRV-Workspace instead and
# calls out to this route over HTTPS. See CRON_SECRET in Netlify env.
